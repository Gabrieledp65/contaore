<title>Foglio Ore</title>
<style>
  :root{
    --paper:#F7F3EC; --paper-line:#DCD3C0; --ink:#1E2A2F; --ink-soft:#5B6A6E;
    --stamp:#8C3B2E; --card:#FFFFFF; --radius:14px;
    --shadow: 0 1px 2px rgba(30,42,47,.06), 0 4px 14px rgba(30,42,47,.06);
    --mono: ui-monospace, "SF Mono", "Menlo", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    display:flex; align-items:center; justify-content:center;
    padding:24px calc(24px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-right));
  }
  .card{
    width:100%; max-width:360px; background:var(--card); border:1px solid var(--paper-line);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:28px 24px 24px;
  }
  .mark{
    width:44px; height:44px; border-radius:11px; background:var(--stamp);
    display:flex; align-items:center; justify-content:center; margin-bottom:18px;
  }
  .mark svg{width:22px; height:22px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round;}
  h1{font-size:20px; line-height:1.25; margin:0 0 6px; letter-spacing:-.01em;}
  .sub{font-size:13.5px; line-height:1.45; color:var(--ink-soft); margin:0 0 22px;}
  label{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:7px;}
  .row{position:relative;}
  input[type=password], input[type=text]{
    width:100%; font-family:var(--sans); font-size:16px; color:var(--ink);
    background:var(--paper); border:1px solid var(--paper-line); border-radius:10px;
    padding:13px 46px 13px 14px; outline:none; -webkit-appearance:none;
  }
  input:focus{border-color:var(--ink-soft); background:#fff;}
  .peek{
    position:absolute; right:4px; top:4px; bottom:4px; width:40px; border:0; background:none;
    cursor:pointer; color:var(--ink-soft); font-family:var(--mono); font-size:11px;
    display:flex; align-items:center; justify-content:center;
  }
  .check{display:flex; align-items:center; gap:9px; margin:14px 0 20px;}
  .check input{width:17px; height:17px; accent-color:var(--stamp); margin:0; flex:0 0 auto;}
  .check span{font-size:13px; color:var(--ink-soft);}
  button.go{
    width:100%; border:0; border-radius:10px; background:var(--ink); color:#fff;
    font-family:var(--sans); font-size:15px; font-weight:600; padding:14px; cursor:pointer;
  }
  button.go:disabled{opacity:.55; cursor:default;}
  .msg{
    min-height:18px; margin-top:14px; font-size:13px; line-height:1.4;
    color:var(--stamp); text-align:center;
  }
  .msg.info{color:var(--ink-soft);}
  .foot{margin-top:22px; padding-top:16px; border-top:1px solid var(--paper-line);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--ink-soft); text-align:center;}
  @media (prefers-color-scheme: dark){
    :root{--paper:#171C1E; --paper-line:#2C3538; --ink:#ECE6DC; --ink-soft:#93A1A5; --card:#1E2528;}
    button.go{background:var(--stamp);}
  }
</style>
</head>

  var STORE_KEY = "fo_key_v1";

  var pw = document.getElementById("pw");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");
  var peek = document.getElementById("peek");
  var remember = document.getElementById("remember");

  function say(text, kind){
    msg.textContent = text || "";
    msg.className = "msg" + (kind === "info" ? " info" : "");
  }

  function b64(str){
    var bin = atob(str), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  if (!window.crypto || !window.crypto.subtle) {
    go.disabled = true;
    say("Questa pagina va aperta tramite un indirizzo https (per esempio il link di GitHub Pages), non aprendo il file direttamente dal computer.");
    return;
  }

  function unlock(password){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name:"PBKDF2", salt:b64(DATA.salt), iterations:DATA.iter, hash:"SHA-256" },
          base, { name:"AES-GCM", length:256 }, false, ["decrypt"]
        );
      })
      .then(function(key){
        return crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(DATA.iv) }, key, b64(DATA.ct));
      })
      .then(function(buf){
        return new TextDecoder().decode(buf);
      });
  }

  function boot(html){
    document.open();
    document.write(html);
    document.close();
  }

  var busy = false;
  function attempt(password, silent){
    if (busy || !password) { if (!silent && !password) say("Inserisci la password."); return; }
    busy = true;
    go.disabled = true;
    say(silent ? "Apertura in corso…" : "Verifica…", "info");

    unlock(password).then(function(html){
      try {
        if (remember.checked) localStorage.setItem(STORE_KEY, password);
        else localStorage.removeItem(STORE_KEY);
      } catch (e) {}
      boot(html);
    }).catch(function(){
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      busy = false;
      go.disabled = false;
      pw.value = "";
      pw.focus();
      say(silent ? "La password salvata non è più valida. Inseriscila di nuovo." : "Password errata.");
    });
  }

  go.addEventListener("click", function(){ attempt(pw.value, false); });
  pw.addEventListener("keydown", function(e){ if (e.key === "Enter") attempt(pw.value, false); });
  pw.addEventListener("input", function(){ if (msg.textContent) say(""); });

  peek.addEventListener("click", function(){
    var shown = pw.type === "text";
    pw.type = shown ? "password" : "text";
    peek.textContent = shown ? "MOSTRA" : "NASCONDI";
    pw.focus();
  });

  var saved = null;
  try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (saved) attempt(saved, true);
  else setTimeout(function(){ pw.focus(); }, 120);
})();
